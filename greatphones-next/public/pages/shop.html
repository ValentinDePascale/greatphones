<div class="page" id="p-shop">
  <div class="sh-hdr">
    <div class="ctr"><h1 style="font-family:'Playfair Display',Georgia,serif;font-size:28px;color:#fff;margin-bottom:.25rem" id="shopTitle">Catálogo</h1><p style="font-size:12px;color:rgba(255,255,255,.4)" id="shopSub">Todos los equipos verificados con garantia incluida</p></div>
  </div>
  <div class="filter-bar">
    <div class="ctr">
      <div class="frow" id="filterBar">
        <button class="fchip act" onclick="filterShop('todos',this)">Todos</button>
        <button class="fchip" onclick="filterShop('iPhone',this)">iPhone</button>
        <button class="fchip" onclick="filterShop('iPad',this)">iPad</button>
        <button class="fchip" onclick="filterShop('MacBook',this)">MacBook</button>
        <button class="fchip" onclick="filterShop('iMac',this)">iMac</button>
        <button class="fchip" onclick="filterShop('Samsung',this)">Samsung</button>
        <button class="fchip" onclick="filterShop('Motorola',this)">Motorola</button>
        <button class="fchip" onclick="filterShop('Xiaomi',this)">Xiaomi</button>
        <button class="fchip" onclick="filterShop('ofertas',this)">Ofertas</button>
        <button class="fchip" onclick="filterShop('fav',this)">Favoritos</button>
      </div>
      <button class="adv-btn" onclick="toggleAdvF()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
        Filtros avanzados
        <svg id="afArr" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left:auto;transition:transform .2s"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>
    <div class="adv-panel" id="advPanel">
      <div class="ctr">
        <div class="af-row">
          <div class="af-grp"><span class="af-lbl">Almacenamiento</span><select class="af-sel" id="af-st" onchange="renderShopGrid()"><option value="">Cualquiera</option><option>64 GB</option><option>128 GB</option><option>256 GB</option><option>512 GB</option><option>1 TB</option></select></div>
          <div class="af-grp"><span class="af-lbl">Estado</span><select class="af-sel" id="af-cd" onchange="renderShopGrid()"><option value="">Cualquiera</option><option>Nuevo</option><option>Impecable</option><option>Muy bueno</option><option>Bueno</option></select></div>
          <div class="af-grp"><span class="af-lbl">Tipo</span><select class="af-sel" id="af-ty" onchange="renderShopGrid()"><option value="">Cualquiera</option><option value="celular">Celulares</option><option value="tablet">Tablets</option><option value="laptop">Laptops</option><option value="desktop">Desktop</option></select></div>
        </div>
        <div class="af-row">
          <div class="af-grp"><span class="af-lbl">Precio min</span><input class="af-inp" type="number" id="af-p1" placeholder="$0" oninput="renderShopGrid()"></div>
          <div class="af-grp"><span class="af-lbl">Precio max</span><input class="af-inp" type="number" id="af-p2" placeholder="Sin limite" oninput="renderShopGrid()"></div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-o btn-sm" onclick="renderShopGrid()">Aplicar</button>
          <button class="btn btn-s btn-sm" onclick="clearAdvF()">Limpiar</button>
        </div>
      </div>
    </div>
  </div>
  <div style="background:#fff;border-bottom:1px solid var(--border)">
    <div class="ctr">
      <div class="sort-row">
        <div class="sort-inner">
          <select class="sort-sel" id="sortSel" onchange="renderShopGrid()">
            <option value="rel">Relevancia</option><option value="asc">Menor precio</option>
            <option value="desc">Mayor precio</option><option value="new">Mas nuevos</option><option value="bat">Mayor bateria</option>
          </select>
          <span class="sort-count" id="shopCount"></span>
        </div>
      </div>
    </div>
  </div>
  <div style="background:var(--cream)">
    <div class="ctr">
      <div class="shop-content"><div class="pgrid" id="shopGrid"></div></div>
    </div>
  </div>
</div>
