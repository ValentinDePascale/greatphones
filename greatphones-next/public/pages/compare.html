<div class="page" id="p-compare">
  <div class="ctr compare-ctr">
    <header class="compare-hdr">
      <span class="compare-eyebrow">Herramientas</span>
      <h1>Comparar dispositivos</h1>
      <p>Seleccioná dos equipos y compará sus características lado a lado para decidir mejor.</p>
    </header>

    <div class="cmp-pick">
      <!-- Dispositivo 1 -->
      <section class="cmp-slot" aria-label="Primer dispositivo">
        <div class="cmp-slot-head">
          <span class="cmp-slot-num">1</span>
          <h3>Primer dispositivo</h3>
          <span class="cmp-slot-state">Paso 1</span>
        </div>
        <div class="cmp-search">
          <svg class="cmp-search-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="compare-search-1" class="cmp-search-input" placeholder="Buscar iPhone, MacBook..." oninput="searchCompareDevice(1, this.value)" aria-label="Buscar primer dispositivo" autocomplete="off">
        </div>
        <div class="cmp-results" id="compare-results-1" style="display:none" role="listbox" aria-live="polite"></div>
        <div class="cmp-selected" id="compare-selected-1"></div>
      </section>

      <!-- Intercambiar -->
      <div class="cmp-swap">
        <button class="cmp-swap-btn" onclick="swapCompareDevices()" aria-label="Intercambiar dispositivos" title="Intercambiar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/></svg>
        </button>
      </div>

      <!-- Dispositivo 2 -->
      <section class="cmp-slot" aria-label="Segundo dispositivo">
        <div class="cmp-slot-head">
          <span class="cmp-slot-num">2</span>
          <h3>Segundo dispositivo</h3>
          <span class="cmp-slot-state">Paso 2</span>
        </div>
        <div class="cmp-search">
          <svg class="cmp-search-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="compare-search-2" class="cmp-search-input" placeholder="Buscar iPhone, MacBook..." oninput="searchCompareDevice(2, this.value)" aria-label="Buscar segundo dispositivo" autocomplete="off">
        </div>
        <div class="cmp-results" id="compare-results-2" style="display:none" role="listbox" aria-live="polite"></div>
        <div class="cmp-selected" id="compare-selected-2"></div>
      </section>
    </div>

    <!-- Tabla comparativa -->
    <div id="compare-table-container"></div>

    <!-- Acciones -->
    <div class="compare-cta">
      <button onclick="clearCompare()" class="cmp-clear">Limpiar comparación</button>
      <button onclick="nav('shop')" class="btn btn-o">Explorar catálogo</button>
    </div>
  </div>
</div>

<!-- ============================= PAGE: SELL ============================= -->
