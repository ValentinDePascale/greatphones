<div class="page" id="p-compare">
  <div class="ctr" style="padding:32px var(--pad)">
    <div style="margin-bottom:32px">
      <h1 style="font-family:'Playfair Display',Georgia,serif;font-size:32px;font-weight:700;color:var(--dk);margin-bottom:8px">Comparar Dispositivos</h1>
      <p style="font-size:14px;color:var(--gray);line-height:1.6">Selecciona dos productos para ver sus características lado a lado</p>
    </div>

    <!-- Selectores de dispositivos -->
    <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:24px;margin-bottom:48px;align-items:start">
      <!-- Dispositivo 1 -->
      <div style="position:relative">
        <div style="background:#fff;border-radius:16px;padding:24px;border:2px solid var(--border);min-height:200px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
            <div style="width:32px;height:32px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">1</div>
            <h3 style="font-size:16px;font-weight:600;color:var(--dk)">Primer dispositivo</h3>
          </div>
          <input type="text" id="compare-search-1" placeholder="Buscar producto..." oninput="searchCompareDevice(1, this.value)" style="width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:12px">
          <div id="compare-results-1" style="max-height:200px;overflow-y:auto;display:none"></div>
          <div id="compare-selected-1"></div>
        </div>
      </div>

      <!-- Botón intercambiar -->
      <div style="display:flex;align-items:center;justify-content:center;padding-top:80px">
        <button onclick="swapCompareDevices()" style="width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s" onmouseover="this.style.borderColor='var(--orange)';this.style.transform='scale(1.1)'" onmouseout="this.style.borderColor='var(--border)';this.style.transform='scale(1)'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/></svg>
        </button>
      </div>

      <!-- Dispositivo 2 -->
      <div style="position:relative">
        <div style="background:#fff;border-radius:16px;padding:24px;border:2px solid var(--border);min-height:200px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
            <div style="width:32px;height:32px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">2</div>
            <h3 style="font-size:16px;font-weight:600;color:var(--dk)">Segundo dispositivo</h3>
          </div>
          <input type="text" id="compare-search-2" placeholder="Buscar producto..." oninput="searchCompareDevice(2, this.value)" style="width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:12px">
          <div id="compare-results-2" style="max-height:200px;overflow-y:auto;display:none"></div>
          <div id="compare-selected-2"></div>
        </div>
      </div>
    </div>

    <!-- Tabla comparativa -->
    <div id="compare-table-container"></div>

    <!-- Botón limpiar -->
    <div style="text-align:center;margin-top:32px">
      <button onclick="clearCompare()" style="padding:12px 32px;background:var(--orange);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s" onmouseover="this.style.background='#e55a1a'" onmouseout="this.style.background='var(--orange)'">Limpiar comparación</button>
    </div>
  </div>
</div>

<!-- ============================= PAGE: SELL ============================= -->
