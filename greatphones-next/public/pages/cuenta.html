<div class="page" id="p-cuenta">
  <div style="background:var(--cream);padding:2rem 1rem;min-height:100vh">
    <div class="ctr" style="max-width:800px">
      <!-- Profile Header -->
      <div style="display:flex;flex-direction:column;md:flex-direction:row;align-items:center;gap:1.5rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border);margin-bottom:1.5rem">
        <div style="position:relative">
          <div class="cuenta-av" id="cuentaAvatar" style="font-family:'Playfair Display',Georgia,serif;width:80px;height:80px;border-radius:50%;background:var(--orange);color:#fff;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center">GP</div>
          <div style="position:absolute;bottom:0;right:0;background:var(--green);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid var(--cream)">
            <span style="color:#fff;font-size:12px">✓</span>
          </div>
        </div>
        <div style="text-align:center;md:text-align:left;flex:1">
          <div style="display:flex;align-items:center;justify-content:center;md:justify-content:flex-start;gap:8px">
            <h1 style="font-family:'Playfair Display',Georgia,serif;font-size:28px;font-weight:700" id="cuentaName">Guest</h1>
            <button onclick="nav('edit-profile');loadEditProfile()" style="background:none;border:none;cursor:pointer;padding:4px;border-radius:50%;display:flex;align-items:center;justify-content:center">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--gray)" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
          </div>
          <p style="font-size:13px;color:var(--gray)" id="cuentaEmail">Inicia sesion para ver tu cuenta</p>
        </div>
      </div>
      
      <!-- Logged In Content -->
      <div id="cuentaLoggedIn" style="display:block">
        <!-- Balance Card -->
        <div style="background:linear-gradient(135deg,var(--dk) 0%,#2a2520 100%);border-radius:24px;padding:2rem;position:relative;overflow:hidden;min-height:200px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;margin-bottom:1.5rem">
          <div style="position:absolute;top:-30px;right:-30px;width:150px;height:150px;background:var(--orange);border-radius:50%;opacity:20;filter:blur(40px)"></div>
          <div style="position:relative;z-index:1">
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:70;color:rgba(255,255,255,.7)">Saldo Great Phones</div>
            <div style="font-family:'Playfair Display',Georgia,serif;font-size:48px;font-weight:700;margin-top:8px" id="cuentaSaldo">$0</div>
          </div>
          <div style="position:relative;z-index:1;display:flex;gap:12px;flex-wrap:wrap;margin-top:1rem">
            <button onclick="nav('shop')" style="background:var(--orange);color:#fff;padding:12px 24px;border-radius:12px;font-size:13px;font-weight:700;border:none;cursor:pointer;display:flex;align-items:center;gap:8px">Usar en compras <span>→</span></button>
            <button style="background:rgba(255,255,255,.1);color:#fff;padding:12px 24px;border-radius:12px;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.2);cursor:pointer">Retirar</button>
          </div>
        </div>
        
        <!-- Grid Layout -->
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:1.5rem">
          <!-- Purchase History -->
          <div style="background:#fff;border-radius:20px;padding:1.5rem;grid-column:span 2;md:grid-column:span 1">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
              <h3 style="font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:700;color:var(--dk)">Historial de Compras</h3>
              <span style="color:var(--gray)">📦</span>
            </div>
            <div id="orderHistory" style="text-align:center;padding:1.5rem 0;color:var(--gray)">
              <div style="font-size:32px;margin-bottom:.5rem">📦</div>
              <p style="font-size:13px">No tenes pedidos</p>
              <button onclick="nav('shop')" style="margin-top:12px;color:var(--orange);background:none;border:none;font-size:12px;font-weight:600;cursor:pointer">Ir a la tienda</button>
            </div>
          </div>
          
          <!-- Quotations -->
          <div style="background:#fff;border-radius:20px;padding:1.5rem;grid-column:span 2;md:grid-column:span 1">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
              <h3 style="font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:700;color:var(--dk)">Mis Cotizaciones</h3>
              <span style="color:var(--gray)">📄</span>
            </div>
            <div id="quotHistory" style="text-align:center;padding:1.5rem 0;color:var(--gray)">
              <div style="font-size:32px;margin-bottom:.5rem">📄</div>
              <p style="font-size:13px">No tenes cotizaciones</p>
              <button style="margin-top:12px;color:var(--orange);background:none;border:none;font-size:12px;font-weight:600;cursor:pointer">Solicitar una ahora</button>
            </div>
          </div>
        </div>
        
        <!-- Messages -->
        <div style="background:#fff;border-radius:20px;padding:1.5rem;margin-bottom:1.5rem">
          <h3 style="font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:700;color:var(--dk);margin-bottom:1rem">Canal Directo</h3>
          <p style="font-size:13px;color:var(--gray);margin-bottom:1rem">¿Necesitás ayuda con una cotización o pedido? Hablá con nosotros.</p>
          <button onclick="nav('mensajes')" style="width:100%;background:var(--green);color:#fff;padding:14px;border-radius:12px;font-size:14px;font-weight:700;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px">💬 Abrir mensajes con GP</button>
        </div>
      </div>
      
      <!-- Logout -->
      <div style="margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--border)">
        <button onclick="doLogout();nav('home')" style="width:100%;padding:14px;border:1.5px solid var(--red);border-radius:12px;background:none;color:var(--red);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px">🚪 Cerrar sesión</button>
        <p style="text-align:center;font-size:10px;color:var(--gray);margin-top:1rem">© 2026 Great Phones. Todos los derechos reservados.</p>
      </div>
    </div>
  </div>
</div>
