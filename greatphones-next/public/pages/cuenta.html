<div class="page" id="p-cuenta">
  <div class="cu-page">
    <div class="cu-container">

      <a href="/productos" class="cu-back" onclick="event.preventDefault();nav('shop')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
        Volver a la tienda
      </a>

      <div class="cu-profile">
        <div class="cu-avatar-wrap">
          <div class="cu-avatar" id="cuentaAvatar">GP</div>
          <div class="cu-avatar-badge">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
        </div>
        <div class="cu-profile-body">
          <div class="cu-name-row">
            <h1 class="cu-name" id="cuentaName">Guest</h1>
            <a href="#" class="cu-edit-link" onclick="event.preventDefault();nav('edit-profile');loadEditProfile()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              Editar
            </a>
          </div>
          <p class="cu-email" id="cuentaEmail">Iniciá sesión para ver tu cuenta</p>
        </div>
      </div>

      <div id="cuentaLoggedIn" style="display:block">

        <div class="cu-balance" id="cuBalanceCard">
          <div class="cu-balance-glow"></div>
          <div class="cu-balance-body">
            <p class="cu-balance-label">Saldo Great Phones</p>
            <div class="cu-balance-amount" id="cuBalanceAmount">
              <div class="cu-skeleton cu-skeleton--dark" style="width:180px;height:52px;border-radius:8px"></div>
            </div>
          </div>
          <div class="cu-balance-actions">
            <a href="/shop" class="cu-btn cu-btn-primary" onclick="event.preventDefault();nav('shop')">
              Usar en compras
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>
            </a>
            <button class="cu-btn cu-btn-secondary">Retirar</button>
          </div>
        </div>

        <div id="cpnLegacyWallet" style="display:none"></div>

        <section class="cu-section">
          <h2 class="cu-section-title">Actividad</h2>

          <div class="cu-card">
            <button class="cu-card-trigger" onclick="this.parentElement.classList.toggle('cu-card--open')">
              <div class="cu-card-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
              </div>
              <div class="cu-card-label">
                <span class="cu-card-title">Mis pedidos</span>
                <span class="cu-card-count" id="orderCount" style="display:none"></span>
              </div>
              <svg class="cu-card-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="cu-card-content">
              <div id="orderHistory" class="cu-card-list">
                <div class="cu-skeleton-row">
                  <div class="cu-skeleton" style="width:40px;height:40px;border-radius:10px;flex-shrink:0"></div>
                  <div style="flex:1;display:flex;flex-direction:column;gap:8px">
                    <div class="cu-skeleton" style="width:65%;height:14px;border-radius:6px"></div>
                    <div class="cu-skeleton" style="width:40%;height:12px;border-radius:6px"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="cu-card">
            <button class="cu-card-trigger" onclick="this.parentElement.classList.toggle('cu-card--open')">
              <div class="cu-card-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
              </div>
              <div class="cu-card-label">
                <span class="cu-card-title">Cotizaciones</span>
                <span class="cu-card-count" id="quoteCount" style="display:none"></span>
              </div>
              <svg class="cu-card-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="cu-card-content">
              <div id="clientQuoteList" class="cu-card-list">
                <div class="cu-skeleton-row">
                  <div class="cu-skeleton" style="width:40px;height:40px;border-radius:10px;flex-shrink:0"></div>
                  <div style="flex:1;display:flex;flex-direction:column;gap:8px">
                    <div class="cu-skeleton" style="width:55%;height:14px;border-radius:6px"></div>
                    <div class="cu-skeleton" style="width:35%;height:12px;border-radius:6px"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="cu-card" id="cuCouponCard">
            <button class="cu-card-trigger" onclick="this.parentElement.classList.toggle('cu-card--open')">
              <div class="cu-card-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg>
              </div>
              <div class="cu-card-label">
                <span class="cu-card-title">Cupones</span>
                <span class="cu-card-count" id="couponCount" style="display:none"></span>
              </div>
              <svg class="cu-card-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="cu-card-content">
              <div class="cpn-section" id="cpnCuentaContainer"></div>
            </div>
          </div>

        </section>

        <div id="walletRedeemSection"></div>
      </div>

      <div class="cu-footer">
        <button class="cu-logout-btn" onclick="doLogout();nav('home')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Cerrar sesión
        </button>
        <p class="cu-legal">© 2026 Great Phones. Todos los derechos reservados.</p>
      </div>

    </div>
  </div>
</div>
