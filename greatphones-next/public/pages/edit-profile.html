<!-- ============================= PAGE: EDIT PROFILE ============================= -->
<div class="page" id="p-edit-profile">
  <div style="background:var(--cream);padding:2rem 1rem;min-height:100vh">
    <div class="ctr">
      
      <div style="margin-bottom:2rem">
        <h2 style="font-family:'Playfair Display',Georgia,serif;font-size:30px;font-weight:700;color:var(--dk);margin-bottom:.5rem">Editar Perfil</h2>
        <p style="font-size:15px;color:var(--gray)">Actualizá tu información personal y datos de tu cuenta</p>
      </div>

      <div style="display:grid;grid-template-columns:1fr;gap:1.5rem;grid-template-columns:repeat(12,1fr)">
        
        <div style="grid-column:span 4;background:#fff;border:1px solid var(--border);border-radius:18px;padding:1.5rem;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center">
          <div style="position:relative">
            <div id="editProfileAvatar" style="width:130px;height:130px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:#fff;font-family:'Playfair Display',Georgia,serif">GP</div>
            <button style="position:absolute;bottom:0;right:0;background:var(--orange);color:#fff;width:36px;height:36px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--sh)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
          </div>
          <div style="text-align:center;margin-top:1rem">
            <button style="background:none;border:none;color:var(--orange);font-size:14px;font-weight:600;cursor:pointer;text-decoration:underline">Cambiar Foto</button>
            <p style="font-size:12px;color:var(--gray);margin-top:4px">JPG, GIF o PNG. Max 1MB.</p>
          </div>
        </div>

        <div style="grid-column:span 8;background:#fff;border:1px solid var(--border);border-radius:18px;padding:1.5rem;box-shadow:var(--sh)">
          <div style="display:grid;gap:1rem">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
              <div>
                <label style="font-size:11px;font-weight:600;color:var(--gray);display:block;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase">Nombre</label>
                <input type="text" id="editProfileName" style="width:100%;padding:12px 14px;background:var(--cream2);border:none;border-radius:12px;font-size:14px;color:var(--dk);box-sizing:border-box">
              </div>
              <div>
                <label style="font-size:11px;font-weight:600;color:var(--gray);display:block;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase">Apellido</label>
                <input type="text" id="editProfileLastname" style="width:100%;padding:12px 14px;background:var(--cream2);border:none;border-radius:12px;font-size:14px;color:var(--dk);box-sizing:border-box">
              </div>
            </div>
            
            <div>
              <label style="font-size:11px;font-weight:600;color:var(--gray);display:block;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase">Teléfono</label>
              <input type="tel" id="editProfilePhone" style="width:100%;padding:12px 14px;background:var(--cream2);border:none;border-radius:12px;font-size:14px;color:var(--dk);box-sizing:border-box">
            </div>
            
            <div>
              <label style="font-size:11px;font-weight:600;color:var(--gray);display:block;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase">Email</label>
              <input type="email" id="editProfileEmail" disabled style="width:100%;padding:12px 14px;background:var(--cream2);border:none;border-radius:12px;font-size:14px;color:var(--gray);cursor:not-allowed;box-sizing:border-box">
              <p style="font-size:11px;color:var(--gray);margin-top:4px">Tu email se usa para seguridad y notificaciones de la cuenta</p>
            </div>
            
            <div>
              <label style="font-size:11px;font-weight:600;color:var(--gray);display:block;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase">Contraseña</label>
              <input type="password" disabled placeholder="••••••••" style="width:100%;padding:12px 14px;background:var(--cream2);border:none;border-radius:12px;font-size:14px;color:var(--gray);cursor:not-allowed;box-sizing:border-box">
            </div>
          </div>
        </div>

        <div onclick="showToast('Próximamente: Configuración de seguridad')" style="grid-column:span 6;background:var(--cream);border:1px solid var(--border);border-radius:18px;padding:1rem;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background .2s" onmouseover="this.style.background='#fff'" onmouseout="this.style.background='var(--cream)'">
          <div style="display:flex;align-items:center;gap:1rem">
            <div style="background:var(--cream3);padding:10px;border-radius:8px;color:var(--dk2)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
            <div>
              <h3 style="font-size:16px;font-weight:600;color:var(--dk)">Seguridad de la Cuenta</h3>
              <p style="font-size:12px;color:var(--gray)">Contraseña, 2FA y sesiones</p>
            </div>
          </div>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--gray)" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </div>

        <div onclick="confirmDeleteAccount()" style="grid-column:span 6;background:#fff;border:1px solid rgba(192,57,43,.2);border-radius:18px;padding:1rem;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background .2s" onmouseover="this.style.background='var(--cream)'" onmouseout="this.style.background='#fff'">
          <div style="display:flex;align-items:center;gap:1rem">
            <div style="background:rgba(192,57,43,.1);padding:10px;border-radius:8px;color:var(--red)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </div>
            <div>
              <h3 style="font-size:16px;font-weight:600;color:var(--red)">Eliminar Cuenta</h3>
              <p style="font-size:12px;color:var(--gray)">Permanentemente tus datos</p>
            </div>
          </div>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(192,57,43,.5)" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:1rem;padding-top:2rem;border-top:1px solid var(--border)">
        <button onclick="nav('cuenta')" style="padding:12px 24px;font-weight:600;color:var(--gray);background:none;border:1px solid var(--border);border-radius:12px;font-size:14px;cursor:pointer;transition:background .2s" onmouseover="this.style.background='var(--cream2)'" onmouseout="this.style.background='none'">Cancelar</button>
        <button onclick="saveEditProfile()" style="padding:12px 32px;font-weight:600;color:#fff;background:var(--orange);border:none;border-radius:12px;font-size:14px;cursor:pointer;box-shadow:var(--sh);transition:background .2s" onmouseover="this.style.background='var(--orange2)'" onmouseout="this.style.background='var(--orange)'">Guardar Cambios</button>
      </div>

    </div>
  </div>
</div>
