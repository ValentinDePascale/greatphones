<div class="page" id="p-edit-profile" style="background:var(--cream);padding:2rem 1rem;min-height:100vh;max-width:1240px;margin:0 auto">
    <div style="margin-bottom:2rem">
        <h2 style="font-family:'Playfair Display',Georgia,serif;font-size:30px;font-weight:700;color:var(--dk);margin-bottom:.5rem">Editar Perfil</h2>
        <p style="font-size:15px;color:var(--gray)">Actualizá tu información personal y datos de facturación</p>
      </div>

      <div style="display:flex;align-items:center;gap:1.5rem;margin-bottom:2rem;padding:1.5rem;background:#fff;border:1px solid var(--border);border-radius:16px">
        <div style="position:relative">
          <div id="editProfileAvatar" style="width:100px;height:100px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:#fff;font-family:'Playfair Display',Georgia,serif">GP</div>
          <label style="position:absolute;bottom:0;right:0;background:var(--orange);color:#fff;width:32px;height:32px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--sh)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            <input type="file" id="profileAvatarInput" accept="image/*" style="display:none" onchange="uploadProfileAvatar(this)">
          </label>
        </div>
        <div>
          <div style="font-weight:600;color:var(--dk);margin-bottom:4px">Foto de perfil</div>
          <div style="font-size:13px;color:var(--gray)">JPG, PNG o GIF. Máximo 1MB.</div>
        </div>
      </div>

      <div style="background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:var(--sh)">
        <div style="display:flex;border-bottom:1px solid var(--border);background:var(--cream2)">
          <button class="ep-tab act" id="epTabPersonal" onclick="switchEditProfileTab('personal')">Mis Datos</button>
          <button class="ep-tab" id="epTabFacturacion" onclick="switchEditProfileTab('facturacion')">Datos de Facturación y Envío</button>
        </div>
        
        <div id="epPersonalContent" style="padding:1.5rem">
          <div style="display:grid;gap:1rem">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
              <div>
                <label style="font-size:11px;font-weight:600;color:var(--gray);display:block;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase">Nombre</label>
                <input type="text" id="editProfileName" style="width:100%;padding:12px 14px;background:var(--cream2);border:none;border-radius:12px;font-size:14px;color:var(--dk);box-sizing:border-box">
              </div>
              <div>
                <label style="font-size:11px;font-weight:600;color:var(--gray);display:block;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase">Apellido</label>
                <input type="text" id="editProfileLastname" style="width:100%;padding:12px 14px;background:var(--cream2);border:none;border-radius:12px;font-size:14px;color:var(--dk);box-sizing:border-box">
              </div>
            </div>
            
            <div>
              <label style="font-size:11px;font-weight:600;color:var(--gray);display:block;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase">Email</label>
              <input type="email" id="editProfileEmail" disabled style="width:100%;padding:12px 14px;background:var(--cream2);border:none;border-radius:12px;font-size:14px;color:var(--gray);cursor:not-allowed;box-sizing:border-box">
              <p style="font-size:11px;color:var(--gray);margin-top:4px">Tu email se usa para seguridad y notificaciones de la cuenta</p>
            </div>
            
            <div>
              <label style="font-size:11px;font-weight:600;color:var(--gray);display:block;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase">Contraseña</label>
              <button onclick="openChangePassword()" style="width:100%;padding:12px 14px;background:#fff;border:1.5px solid var(--border);border-radius:12px;font-size:14px;color:var(--dk);cursor:pointer;text-align:left;box-sizing:border-box;transition:border-color .15s" onmouseover="this.style.borderColor='var(--orange)'" onmouseout="this.style.borderColor='var(--border)'">
                Cambiar contraseña →
              </button>
            </div>
            </div>
          </div>
        
        <div id="epFacturacionContent" style="padding:1.5rem;display:none">
          <div style="display:grid;gap:1rem">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
              <div>
                <label style="font-size:11px;font-weight:600;color:var(--gray);display:block;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase">DNI / CUIT</label>
                <input type="text" id="editProfileDni" placeholder="12345678" style="width:100%;padding:12px 14px;background:var(--cream2);border:none;border-radius:12px;font-size:14px;color:var(--dk);box-sizing:border-box">
              </div>
              <div>
                <label style="font-size:11px;font-weight:600;color:var(--gray);display:block;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase">Teléfono</label>
                <input type="tel" id="editProfileFactPhone" placeholder="+54 9 291 1234567" style="width:100%;padding:12px 14px;background:var(--cream2);border:none;border-radius:12px;font-size:14px;color:var(--dk);box-sizing:border-box">
              </div>
            </div>
            
            <div style="display:grid;grid-template-columns:2fr 1fr;gap:1rem">
              <div>
                <label style="font-size:11px;font-weight:600;color:var(--gray);display:block;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase">Calle</label>
                <input type="text" id="editProfileCalle" placeholder="Av. Belgrano" style="width:100%;padding:12px 14px;background:var(--cream2);border:none;border-radius:12px;font-size:14px;color:var(--dk);box-sizing:border-box">
              </div>
              <div>
                <label style="font-size:11px;font-weight:600;color:var(--gray);display:block;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase">Número</label>
                <input type="text" id="editProfileNumero" placeholder="1234" style="width:100%;padding:12px 14px;background:var(--cream2);border:none;border-radius:12px;font-size:14px;color:var(--dk);box-sizing:border-box">
              </div>
            </div>
            
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
              <div>
                <label style="font-size:11px;font-weight:600;color:var(--gray);display:block;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase">Piso / Depto</label>
                <input type="text" id="editProfilePiso" placeholder="2do A (opcional)" style="width:100%;padding:12px 14px;background:var(--cream2);border:none;border-radius:12px;font-size:14px;color:var(--dk);box-sizing:border-box">
              </div>
              <div>
                <label style="font-size:11px;font-weight:600;color:var(--gray);display:block;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase">Código Postal</label>
                <input type="text" id="editProfileCp" placeholder="8000" style="width:100%;padding:12px 14px;background:var(--cream2);border:none;border-radius:12px;font-size:14px;color:var(--dk);box-sizing:border-box">
              </div>
            </div>
            
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
              <div>
                <label style="font-size:11px;font-weight:600;color:var(--gray);display:block;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase">Provincia</label>
                <select id="editProfileProvincia" style="width:100%;padding:12px 14px;background:var(--cream2);border:none;border-radius:12px;font-size:14px;color:var(--dk);box-sizing:border-box;appearance:none;cursor:pointer">
                  <option value="">Seleccionar...</option>
                  <option value="Buenos Aires">Buenos Aires</option>
                  <option value="CABA">Capital Federal</option>
                  <option value="Córdoba">Córdoba</option>
                  <option value="Santa Fe">Santa Fe</option>
                  <option value="Mendoza">Mendoza</option>
                  <option value="Tucumán">Tucumán</option>
                  <option value="Entre Ríos">Entre Ríos</option>
                  <option value="Salta">Salta</option>
                  <option value="Neuquén">Neuquén</option>
                  <option value="Río Negro">Río Negro</option>
                  <option value="Chubut">Chubut</option>
                  <option value="Santa Cruz">Santa Cruz</option>
                  <option value="Tierra del Fuego">Tierra del Fuego</option>
                  <option value="San Juan">San Juan</option>
                  <option value="San Luis">San Luis</option>
                  <option value="La Rioja">La Rioja</option>
                  <option value="Catamarca">Catamarca</option>
                  <option value="Santiago del Estero">Santiago del Estero</option>
                  <option value="Formosa">Formosa</option>
                  <option value="Corrientes">Corrientes</option>
                  <option value="Misiones">Misiones</option>
                  <option value="La Pampa">La Pampa</option>
                </select>
              </div>
              <div>
                <label style="font-size:11px;font-weight:600;color:var(--gray);display:block;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase">Localidad</label>
                <input type="text" id="editProfileCiudad" placeholder="Bahía Blanca" style="width:100%;padding:12px 14px;background:var(--cream2);border:none;border-radius:12px;font-size:14px;color:var(--dk);box-sizing:border-box">
              </div>
            </div>
          </div>
        </div>
      </div>
      
<div style="margin-top:1.5rem;display:flex;gap:1rem">
        <button onclick="saveEditProfile()" style="padding:14px 28px;background:var(--orange);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer">Guardar Cambios</button>
        <button onclick="nav('cuenta')" style="padding:14px 28px;background:var(--cream2);color:var(--gray);border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer">Cancelar</button>
      </div>

      <div style="margin-top:2rem;padding-top:2rem;border-top:1px solid var(--border)">
        <h3 style="font-size:18px;font-weight:600;color:var(--dk);margin-bottom:1rem">Seguridad y Otros</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
          <div onclick="openSecurityPanel()" style="background:#fff;border:1px solid var(--border);border-radius:16px;padding:1.25rem;cursor:pointer;transition:all .2s" onmouseover="this.style.borderColor='var(--orange)'" onmouseout="this.style.borderColor='var(--border)'">
            <div style="display:flex;align-items:center;gap:1rem">
              <div style="background:var(--cream);padding:12px;border-radius:10px">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              </div>
              <div>
                <div style="font-weight:600;color:var(--dk)">Seguridad de la Cuenta</div>
                <div style="font-size:12px;color:var(--gray)">Cambiar contraseña</div>
              </div>
            </div>
          </div>
          <div onclick="confirmDeleteAccount()" style="background:#fff;border:1px solid rgba(192,57,43,.2);border-radius:16px;padding:1.25rem;cursor:pointer;transition:all .2s" onmouseover="this.style.borderColor='var(--red)'" onmouseout="this.style.borderColor='rgba(192,57,43,.2)'">
            <div style="display:flex;align-items:center;gap:1rem">
              <div style="background:rgba(192,57,43,.1);padding:12px;border-radius:10px">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              </div>
              <div>
                <div style="font-weight:600;color:var(--red)">Eliminar Cuenta</div>
                <div style="font-size:12px;color:var(--gray)">Borrar datos permanently</div>
              </div>
            </div>
          </div>
        </div>
    </div>
</div>

<!-- ============================= PAGE: ADMIN-ACCESSORY ============================= -->
