<div class="page" id="p-register">
  <div style="background:var(--cream);padding:2rem 1rem;min-height:100vh">
    <div class="ctr" style="max-width:700px">
      <div style="background:#fff;border-radius:20px;padding:2rem;box-shadow:0 4px 20px rgba(0,0,0,.08)">
        
        <div id="registerFormStep1">
          <button onclick="nav('home')" style="background:none;border:none;font-size:14px;color:var(--gray);cursor:pointer;margin-bottom:1rem;display:flex;align-items:center;gap:4px">← Volver</button>
          <h1 style="font-family:'Playfair Display',Georgia,serif;font-size:28px;font-weight:700;margin-bottom:.5rem">Crear cuenta</h1>
          <p style="font-size:13px;color:var(--gray);margin-bottom:1.5rem">Completá tus datos para registrarte</p>
          
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
            <input type="text" id="regName" placeholder="Nombre *" style="width:100%;padding:14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;box-sizing:border-box">
            <input type="text" id="regLastname" placeholder="Apellido *" style="width:100%;padding:14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;box-sizing:border-box">
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
            <input type="email" id="regEmail" placeholder="Email *" style="width:100%;padding:14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;box-sizing:border-box">
            <input type="tel" id="regPhone" placeholder="WhatsApp" style="width:100%;padding:14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;box-sizing:border-box">
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px">
            <input type="text" id="regDni" placeholder="DNI" style="width:100%;padding:14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;box-sizing:border-box">
            <input type="text" id="regProvincia" placeholder="Provincia" style="width:100%;padding:14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;box-sizing:border-box">
            <input type="text" id="regCiudad" placeholder="Ciudad" style="width:100%;padding:14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;box-sizing:border-box">
          </div>
          <div style="position:relative;height:48px;margin-bottom:6px">
            <input type="password" id="regPassword" placeholder="Contraseña *" oninput="checkPasswordStrength()" style="width:100%;padding:14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:0;box-sizing:border-box;height:48px">
            <button type="button" onclick="togglePassword('regPassword','regPasswordToggle')" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:0">
              <img id="regPasswordToggle" src="/icons/eye-open.svg" width="18" height="18" alt="Mostrar">
            </button>
          </div>
          <div id="passwordStrength" style="font-size:12px;font-weight:600;margin-bottom:4px"></div>
          <div id="passwordMissing" style="font-size:11px;margin-bottom:12px;color:var(--red)"></div>
          <div style="position:relative;height:48px;margin-bottom:12px">
            <input type="password" id="regConfirmPassword" placeholder="Confirmar contraseña *" style="width:100%;padding:14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:0;box-sizing:border-box;height:48px">
            <button type="button" onclick="togglePassword('regConfirmPassword','regConfirmPasswordToggle')" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:0">
              <img id="regConfirmPasswordToggle" src="/icons/eye-open.svg" width="18" height="18" alt="Mostrar">
            </button>
          </div>
          
          <div style="padding:12px;background:rgba(59,130,60,0.1);border-radius:12px;margin-bottom:1rem;display:flex;gap:8px;align-items:flex-start">
            <span style="font-size:16px">✓</span>
            <div style="font-size:12px;color:var(--green)">Usando Great Phones vas a poder comprar con garantia, cotizar tu equipo usado y acceder a precios exclusivos.</div>
          </div>
          
          <button onclick="doRegister()" style="width:100%;padding:14px;border:none;border-radius:12px;background:var(--orange);color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:1rem">Crear cuenta</button>
          
          <p style="text-align:center;font-size:12px;color:var(--gray)">Ya tenes cuenta? <button onclick="openLogin()" style="background:none;border:none;color:var(--orange);font-size:12px;font-weight:600;cursor:pointer">Iniciar sesión</button></p>
        </div>
        
        <div id="pageVerifyStep" style="display:none">
          <h3 style="font-size:16px;margin-bottom:8px;text-align:center">Verificá tu email</h3>
          <p style="font-size:13px;color:var(--gray);text-align:center;margin-bottom:4px">Te enviamos un código a <span id="pageVerifyEmail" style="font-weight:600"></span></p>
          <p style="font-size:11px;color:var(--orange);text-align:center;margin-bottom:16px">El código vence en <span id="pageCodeTimer" style="font-weight:700">10:00</span></p>
          <div style="display:flex;gap:8px;justify-content:center;margin-bottom:16px">
            <input type="text" id="pv1" maxlength="1" oninput="moveToNext(this,'pv2')" style="width:44px;height:54px;border:2px solid var(--border);border-radius:10px;font-size:24px;text-align:center;font-weight:700;outline:none">
            <input type="text" id="pv2" maxlength="1" oninput="moveToNext(this,'pv3')" onkeydown="moveBack(event,'pv1')" style="width:44px;height:54px;border:2px solid var(--border);border-radius:10px;font-size:24px;text-align:center;font-weight:700">
            <input type="text" id="pv3" maxlength="1" oninput="moveToNext(this,'pv4')" onkeydown="moveBack(event,'pv2')" style="width:44px;height:54px;border:2px solid var(--border);border-radius:10px;font-size:24px;text-align:center;font-weight:700">
            <input type="text" id="pv4" maxlength="1" oninput="moveToNext(this,'pv5')" onkeydown="moveBack(event,'pv3')" style="width:44px;height:54px;border:2px solid var(--border);border-radius:10px;font-size:24px;text-align:center;font-weight:700">
            <input type="text" id="pv5" maxlength="1" oninput="moveToNext(this,'pv6')" onkeydown="moveBack(event,'pv4')" style="width:44px;height:54px;border:2px solid var(--border);border-radius:10px;font-size:24px;text-align:center;font-weight:700">
            <input type="text" id="pv6" maxlength="1" onkeydown="moveBack(event,'pv5')" style="width:44px;height:54px;border:2px solid var(--border);border-radius:10px;font-size:24px;text-align:center;font-weight:700">
          </div>
          <button onclick="verifyAndCompleteRegister()" style="width:100%;padding:14px;border:none;border-radius:12px;background:var(--orange);color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:1rem">Verificar y crear cuenta</button>
          <button onclick="showPageRegisterStep()" style="width:100%;padding:10px;border:none;background:none;color:var(--gray);font-size:12px;cursor:pointer">Volver</button>
        </div>
      </div>
    </div>
  </div>
</div>
