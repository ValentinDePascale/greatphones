<div class="page" id="p-forgot-password" style="background:linear-gradient(180deg,var(--cream) 0%,#fff 100%)">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem">
    <div style="width:min(440px,100%);background:#fff;border-radius:24px;padding:2.5rem;box-shadow:0 20px 60px rgba(0,0,0,.08);border:1px solid var(--border)">
      <div style="text-align:center;margin-bottom:2rem">
        <div style="width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--orange) 0%,#e55a1a 100%);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        </div>
        <h1 style="font-family:'Playfair Display',Georgia,serif;font-size:28px;font-weight:700;color:var(--dk);margin-bottom:.5rem">Recuperar contraseña</h1>
        <p style="font-size:14px;color:var(--gray)">Ingresa tu email y te enviaremos un codigo</p>
      </div>
      <div>
        <div style="margin-bottom:1.5rem">
          <label style="font-size:12px;font-weight:600;color:var(--gray);margin-bottom:6px;display:block">Email</label>
          <input type="email" id="forgotEmail" placeholder="tu@email.com" style="width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;box-sizing:border-box;outline:none;transition:border-color .15s" onfocus="this.style.borderColor='var(--orange)'" onblur="this.style.borderColor='var(--border)'">
        </div>
        <div id="forgotError" style="display:none;padding:12px;background:rgba(239,68,68,.08);border-radius:12px;color:var(--red);font-size:13px;margin-bottom:1rem;text-align:center;border:1px solid rgba(239,68,68,.15)"></div>
        <div id="forgotSuccess" style="display:none;padding:12px;background:rgba(5,150,105,.08);border-radius:12px;color:#059669;font-size:13px;margin-bottom:1rem;text-align:center;border:1px solid rgba(5,150,105,.15)"></div>
        <button onclick="sendForgotCode()" style="width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--orange) 0%,#e55a1a 100%);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s;box-shadow:0 4px 12px rgba(255,107,44,.3)" onmouseover="this.style.transform='translateY(-1px)'" onmouseout="this.style.transform='translateY(0)'">
          Enviar codigo
        </button>
        <p style="text-align:center;margin-top:1.5rem;font-size:14px;color:var(--gray)">
          <button onclick="nav('login')" style="background:none;border:none;color:var(--orange);font-size:14px;font-weight:600;cursor:pointer">Volver al login</button>
        </p>
      </div>
    </div>
  </div>
</div>
