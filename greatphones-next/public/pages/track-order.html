<div class="page" id="p-track-order" style="background:var(--cream);padding:2rem 1rem;min-height:100vh">
  <div style="max-width:700px;margin:0 auto">
    <button onclick="nav('home')" style="display:flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;color:var(--gray);font-size:14px;margin-bottom:1.5rem">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Volver al inicio
    </button>
    <h1 style="font-family:'Playfair Display',Georgia,serif;font-size:30px;font-weight:700;color:var(--dk);margin-bottom:.5rem">Seguir mi pedido</h1>
    <p style="font-size:15px;color:var(--gray);margin-bottom:2rem">Ingresa tu codigo de orden y email para ver el estado</p>
    <div id="trackForm" style="background:#fff;border:1px solid var(--border);border-radius:18px;padding:1.5rem;box-shadow:var(--sh)">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
        <div>
          <label style="font-size:11px;font-weight:600;color:var(--gray);display:block;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase">Codigo de orden</label>
          <input type="text" id="trackCode" placeholder="GP-XXXXX" style="width:100%;padding:12px 14px;background:var(--cream2);border:none;border-radius:12px;font-size:14px;color:var(--dk);box-sizing:border-box">
        </div>
        <div>
          <label style="font-size:11px;font-weight:600;color:var(--gray);display:block;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase">Email</label>
          <input type="email" id="trackEmail" placeholder="tu@email.com" style="width:100%;padding:12px 14px;background:var(--cream2);border:none;border-radius:12px;font-size:14px;color:var(--dk);box-sizing:border-box">
        </div>
      </div>
      <div id="trackError" style="display:none;padding:12px;background:rgba(239,68,68,.08);border-radius:12px;color:var(--red);font-size:13px;margin-bottom:1rem;text-align:center"></div>
      <button onclick="loadOrderTracking()" style="width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--orange) 0%,#e55a1a 100%);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s;box-shadow:0 4px 12px rgba(255,107,44,.3)" onmouseover="this.style.transform='translateY(-1px)'" onmouseout="this.style.transform='translateY(0)'">
        Buscar pedido
      </button>
    </div>
    <div id="trackResult" style="display:none;margin-top:2rem">
      <div style="background:#fff;border:1px solid var(--border);border-radius:18px;padding:1.5rem;box-shadow:var(--sh)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
          <div>
            <h2 style="font-family:'Playfair Display',Georgia,serif;font-size:22px;font-weight:700;color:var(--dk)" id="trackOrderCode"></h2>
            <p style="font-size:13px;color:var(--gray)" id="trackOrderDate"></p>
          </div>
          <span id="trackOrderStatus" style="padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600"></span>
        </div>
        <div id="trackTimeline" style="margin-bottom:1.5rem"></div>
        <div style="border-top:1px solid var(--border);padding-top:1rem">
          <h3 style="font-size:14px;font-weight:600;color:var(--dk);margin-bottom:.75rem">Productos</h3>
          <div id="trackItems"></div>
        </div>
        <div style="border-top:1px solid var(--border);padding-top:1rem;margin-top:1rem">
          <h3 style="font-size:14px;font-weight:600;color:var(--dk);margin-bottom:.5rem">Direccion de envio</h3>
          <p style="font-size:13px;color:var(--gray)" id="trackShipping"></p>
        </div>
        <div style="border-top:1px solid var(--border);padding-top:1rem;margin-top:1rem;display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:14px;font-weight:600;color:var(--dk)">Total</span>
          <span style="font-size:20px;font-weight:700;color:var(--orange)" id="trackTotal"></span>
        </div>
      </div>
    </div>
  </div>
</div>
