<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Great Phones — Panel</title>
  <script>window.addEventListener('error',function(e){console.error('GP Error:',e.message,'at',e.filename+':'+e.lineno);return false});window.addEventListener('unhandledrejection',function(e){console.error('GP Unhandled rejection:',e.reason)})</script>
</head>
<body style="margin:0">
  <div id="splash" style="position:fixed;inset:0;background:#FDF8F3;display:flex;align-items:center;justify-content:center;z-index:99999;flex-direction:column;gap:16px;transition:opacity .3s">
    <div style="font-family:'Playfair Display',serif;font-size:24px;color:#FF6B2C">Great Phones</div>
    <div style="width:24px;height:24px;border:3px solid #e5e5e5;border-top-color:#FF6B2C;border-radius:50%;animation:spin 1s linear infinite"></div>
  </div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>

  <!--GP_ADMIN_PAGES-->

  <!-- Admin Modal System -->
  <div id="adminModalOverlay" class="admin-modal-overlay">
    <div class="admin-modal">
      <div id="adminModalIcon" class="admin-modal-icon"></div>
      <h3 id="adminModalTitle" class="admin-modal-title"></h3>
      <p id="adminModalMessage" class="admin-modal-message"></p>
      <div id="adminModalActions" class="admin-modal-actions"></div>
    </div>
  </div>

  <!-- Admin Toast Container -->
  <div id="adminToastContainer" class="admin-toast-container"></div>

  <script defer src="/vendor/gsap/gsap.min.js?v=1"></script>
  <script defer src="/lib/constants.js?v=4"></script>
  <script defer src="/lib/storage.js?v=4"></script>
  <script defer src="/lib/utils.js?v=4"></script>
  <script defer src="/lib/fetch-wrapper.js?v=1"></script>
  <script defer src="/lib/navigation.js?v=6"></script>
  <script defer src="/lib/notifications.js?v=4"></script>
  <script defer src="/lib/admin.js?v=4"></script>
  <script defer src="/lib/admin-ui.js?v=4"></script>
  <script defer src="/lib/instore.js?v=4"></script>
  <script defer src="/lib/preventa.js?v=4"></script>
  <script defer src="/lib/render.js?v=6"></script>
  <script defer src="/lib/dolarapi.js?v=1"></script>
  <script defer src="/lib/scanner.js?v=1"></script>
  <script defer src="/lib/chat.js?v=4"></script>
  <script defer src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script defer src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</body>
</html>
