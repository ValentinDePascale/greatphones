<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Ofertas - Great Phones</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/globals.css">
  <link rel="stylesheet" href="../../styles/components.css">
  <link rel="stylesheet" href="../../styles/pages.css">
  <link rel="stylesheet" href="../../styles/responsive.css">
</head>
<body style="background:#F5F0E8;padding:0;margin:0">
  <div class="shop-hdr" style="background:#0E0B07;padding:1.5rem 1rem 1rem">
    <h1 class="shop-h" style="font-family:'Playfair Display',Georgia,serif;font-size:22px;color:#F5F0E8;margin-bottom:.2rem">Ofertas</h1>
    <p class="shop-s" style="font-size:11px;color:rgba(255,255,255,.35)">Precios especiales por tiempo limitado</p>
  </div>
  <div class="shop-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:1.1rem 1rem 2rem;background:#F5F0E8">
    <div class="sgcard" style="background:#F5F0E8;border-radius:13px;overflow:hidden;border:1px solid rgba(0,0,0,.09)">
      <div class="sgcard-img" style="height:110px;display:flex;align-items:center;justify-content:center;font-size:42px;background:#EDE6D8;position:relative">
        📱
        <span class="bdg b-red" style="position:absolute;bottom:6px;left:6px">-12%</span>
      </div>
      <div class="sgcard-body" style="padding:.65rem">
        <div class="sgcard-name" style="font-size:11px;font-weight:500">iPhone 14</div>
        <div class="sgcard-sub" style="font-size:9px;color:#9A9186;margin-top:2px">128 GB Azul</div>
        <div class="sgcard-btm">
          <span class="sgcard-price">$680.000</span>
        </div>
      </div>
    </div>
    <div class="sgcard" style="background:#F5F0E8;border-radius:13px;overflow:hidden;border:1px solid rgba(0,0,0,.09)">
      <div class="sgcard-img" style="height:110px;display:flex;align-items:center;justify-content:center;font-size:42px;background:#EDE6D8;position:relative">
        🌌
        <span class="bdg b-red" style="position:absolute;bottom:6px;left:6px">-10%</span>
      </div>
      <div class="sgcard-body" style="padding:.65rem">
        <div class="sgcard-name" style="font-size:11px;font-weight:500">Galaxy S23+</div>
        <div class="sgcard-sub" style="font-size:9px;color:#9A9186;margin-top:2px">256 GB Phantom</div>
        <div class="sgcard-btm">
          <span class="sgcard-price">$580.000</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
