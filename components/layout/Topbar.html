<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Topbar - Great Phones</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/globals.css">
  <link rel="stylesheet" href="../../styles/components.css">
  <link rel="stylesheet" href="../../styles/responsive.css">
</head>
<body style="background:#0E0B07;padding:0;margin:0">
  <div class="topbar">
    <div class="tb-loc">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span>Envios a</span><span class="tb-loc-v">Bahia Blanca</span>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-links">
      <button class="tb-lnk">Vende tu equipo</button>
      <button class="tb-lnk">Servicio tecnico</button>
      <button class="tb-lnk">Mayoristas</button>
      <button class="tb-lnk">Ofertas</button>
    </div>
    <div class="tb-right"><button class="tb-admin">Admin</button></div>
  </div>
</body>
</html>
