<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>MainNav - Great Phones</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/globals.css">
  <link rel="stylesheet" href="../../styles/components.css">
  <link rel="stylesheet" href="../../styles/responsive.css">
</head>
<body style="background:#0E0B07;padding:0;margin:0">
  <div class="mainnav">
    <div class="nav-logo">
      <svg width="36" height="36" viewBox="0 0 48 48" fill="none">
        <ellipse cx="24" cy="30" rx="16" ry="11" fill="#F5F0E8"/>
        <ellipse cx="24" cy="29" rx="13" ry="9" fill="#1A1008"/>
        <circle cx="20" cy="27" r="2" fill="#F5F0E8"/><circle cx="28" cy="27" r="2" fill="#F5F0E8"/>
        <circle cx="20.5" cy="27" r="0.8" fill="#1A1008"/><circle cx="28.5" cy="27" r="0.8" fill="#1A1008"/>
        <ellipse cx="24" cy="31" rx="1.5" ry="0.8" fill="#FF6B2C"/>
        <line x1="17" y1="30" x2="10" y2="28" stroke="#F5F0E8" stroke-width="0.8"/>
        <line x1="17" y1="31.5" x2="10" y2="31.5" stroke="#F5F0E8" stroke-width="0.8"/>
        <line x1="31" y1="30" x2="38" y2="28" stroke="#F5F0E8" stroke-width="0.8"/>
        <line x1="31" y1="31.5" x2="38" y2="31.5" stroke="#F5F0E8" stroke-width="0.8"/>
        <path d="M16 24 Q14 16 18 14 Q20 20 24 20 Q28 20 30 14 Q34 16 32 24" fill="#1A1008"/>
        <polygon points="15,20 12,12 18,17" fill="#1A1008"/>
        <polygon points="33,20 36,12 30,17" fill="#1A1008"/>
      </svg>
      <div><div class="nav-logo-text">Great Phones</div><div class="nav-logo-sub">Bahia Blanca</div></div>
    </div>
    <div class="nav-search">
      <input class="nsi" placeholder="Buscar iPhone, MacBook, Samsung, reparaciones...">
      <button class="nsb">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </div>
    <div class="nav-acts">
      <button class="nbtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      </button>
      <button class="nbtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
      </button>
      <button class="nbtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <span>Carrito</span>
      </button>
      <button class="nbtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Cuenta</span>
      </button>
      <button class="nbtn nbtn-o"><span>Vender</span></button>
    </div>
  </div>
</body>
</html>
