<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Detalle Producto - Great Phones</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/globals.css">
  <link rel="stylesheet" href="../../styles/components.css">
  <link rel="stylesheet" href="../../styles/pages.css">
</head>
<body style="background:#F5F0E8;padding:0;margin:0">
  <div class="det-back-wrap" style="background:#F5F0E8;padding:.65rem 1rem 0">
    <button class="det-back" style="display:flex;align-items:center;gap:5px;font-size:12px;color:#9A9186;cursor:pointer;background:none;border:none;padding:0">← Volver al catalogo</button>
  </div>
  <div class="det-body" style="background:#F5F0E8;padding:1rem 1rem 2rem">
    <div class="det-img" style="background:#EDE6D8;border-radius:15px;height:210px;display:flex;align-items:center;justify-content:center;font-size:90px;margin-bottom:1.1rem;position:relative">
      📱
      <div class="det-fav-btn" style="position:absolute;top:11px;right:11px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.09);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px">♡</div>
      <div class="det-score" style="position:absolute;bottom:11px;right:11px;background:#0E0B07;border-radius:8px;padding:5px 9px;text-align:center">
        <div style="font-family:'Playfair Display',Georgia,serif;font-size:18px;color:#2D6B4F">94</div>
        <div style="font-size:7px;color:rgba(255,255,255,.35);text-transform:uppercase">Score</div>
      </div>
    </div>
    <h1 class="det-name" style="font-family:'Playfair Display',Georgia,serif;font-size:21px;font-weight:500;margin-bottom:3px">iPhone 15 Pro</h1>
    <div class="det-meta" style="font-size:12px;color:#9A9186;margin-bottom:.75rem">256 GB — Bateria 94%</div>
    <div class="det-price-row" style="display:flex;align-items:baseline;gap:9px;margin-bottom:.65rem">
      <span class="det-price" style="font-family:'Playfair Display',Georgia,serif;font-size:28px;font-weight:500;color:#FF6B2C">$1.150.000</span>
    </div>
    <div class="cuota-band" style="background:rgba(31,61,43,.06);border:1px solid rgba(31,61,43,.1);border-radius:9px;padding:.75rem;margin-bottom:1.1rem">
      <div class="cb-t" style="font-size:11px;font-weight:500;margin-bottom:.4rem">Cuotas disponibles</div>
      <div class="cb-opts" style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.4rem">
        <span class="cb-chip act" style="font-size:10px;background:#1F3D2B;color:#fff;border:1px solid #1F3D2B;border-radius:5px;padding:4px 8px">1 cuota</span>
        <span class="cb-chip" style="font-size:10px;background:#EDE6D8;border:1px solid rgba(0,0,0,.09);border-radius:5px;padding:4px 8px">3 cuotas</span>
        <span class="cb-chip" style="font-size:10px;background:#EDE6D8;border:1px solid rgba(0,0,0,.09);border-radius:5px;padding:4px 8px">6 cuotas</span>
        <span class="cb-chip" style="font-size:10px;background:#EDE6D8;border:1px solid rgba(0,0,0,.09);border-radius:5px;padding:4px 8px">12 cuotas</span>
      </div>
    </div>
    <div class="trust-row" style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:1.1rem">
      <span class="trust-pill" style="font-size:10px;color:#9A9186;background:#EDE6D8;padding:4px 8px;border-radius:5px">Garantia 12 meses</span>
      <span class="trust-pill" style="font-size:10px;color:#9A9186;background:#EDE6D8;padding:4px 8px;border-radius:5px">IMEI verificado</span>
      <span class="trust-pill" style="font-size:10px;color:#9A9186;background:#EDE6D8;padding:4px 8px;border-radius:5px">24 cuotas</span>
    </div>
    <div class="opt-st" style="font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:#9A9186;margin-bottom:.4rem">Garantia extendida</div>
    <div class="opt-list" style="display:flex;flex-direction:column;gap:4px;margin-bottom:1.1rem">
      <div class="opt-row act" style="display:flex;align-items:center;justify-content:space-between;padding:.575rem .75rem;border:1.5px solid #FF6B2C;background:#FFF5EF;border-radius:8px">
        <span class="opt-l" style="font-size:11px;font-weight:500">12 meses — incluida</span>
        <span class="opt-r" style="font-size:10px;color:#2D6B4F;font-weight:500">Gratis</span>
      </div>
    </div>
    <div class="total-band" style="background:#EDE6D8;border-radius:9px;padding:.75rem;display:flex;justify-content:space-between;align-items:center;margin-bottom:.875rem">
      <span class="total-l" style="font-size:11px;color:#9A9186">Total a pagar</span>
      <span class="total-v" style="font-family:'Playfair Display',Georgia,serif;font-size:22px;font-weight:500;color:#FF6B2C">$1.150.000</span>
    </div>
    <button class="btn-fo" style="width:100%;padding:13px;border:none;border-radius:9px;background:#FF6B2C;color:#fff;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:6px">+ Agregar al carrito</button>
    <button class="btn-fg" style="width:100%;padding:12px;border:none;border-radius:9px;background:#1F3D2B;color:#fff;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px">Comprar ahora</button>
  </div>
</body>
</html>
