name: DB Backup

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 3 AM UTC-3
  workflow_dispatch: # Manual trigger

jobs:
  backup:
    name: Backup PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          FILENAME="greatphones_backup_${TIMESTAMP}.sql"
          echo "Backing up to ${FILENAME}"
          pg_dump "$DATABASE_URL" --no-owner --no-acl > "${FILENAME}"
          echo "BACKUP_FILE=${FILENAME}" >> $GITHUB_ENV

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: ${{ env.BACKUP_FILE }}
          retention-days: 7

      - name: Upload to external storage (optional)
        if: false
        env:
          S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_KEY }}
        run: |
          aws s3 cp "${BACKUP_FILE}" "s3://${S3_BUCKET}/backups/" --endpoint-url "${S3_ENDPOINT}"
