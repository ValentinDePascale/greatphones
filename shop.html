<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
  <meta name="theme-color" content="#1A1208">
  <title>Catalogo - Great Phones Bahia Blanca</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/globals.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/pages.css">
  <link rel="stylesheet" href="styles/admin.css">
  <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="tb">
    <button class="tb-loc" onclick="promptLocation()">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span>Envios a&nbsp;</span><span class="tb-lv" id="locVal">Bahia Blanca</span>
    </button>
    <div class="tb-sep"></div>
    <div class="tb-links">
      <button class="tb-lnk" onclick="window.location.href='app.html'">Vende tu equipo</button>
      <button class="tb-lnk" onclick="window.location.href='app.html#servicio'">Servicio tecnico</button>
      <button class="tb-lnk" onclick="window.location.href='app.html#mayorista'">Mayoristas</button>
      <button class="tb-lnk" onclick="window.location.href='app.html#compare'">Comparar modelos</button>
    </div>
    <div class="tb-right">
      <button class="tb-pill tb-pill-o" onclick="window.location.href='app.html#admin'">Admin</button>
      <button class="tb-pill tb-pill-g" onclick="window.location.href='app.html#vendor'">Vendedor</button>
    </div>
  </div>
</div>

<!-- MAIN NAV -->
<div class="mainnav">
  <div class="nav">
    <button class="nav-logo" onclick="window.location.href='app.html'">
      <div class="nav-mark">&#128241;</div>
      <div><span class="nav-txt">Great Phones</span><span class="nav-sub">Bahia Blanca</span></div>
    </button>
    <div class="nav-search">
      <input class="nsi" id="searchInput" placeholder="Buscar iPhone, MacBook, Samsung..." oninput="handleSearch(this.value)" onkeydown="if(event.key==='Enter')doSearch()">
      <button class="nsb" onclick="doSearch()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <div class="srdd" id="searchDD"></div>
    </div>
    <div class="nav-acts">
      <button class="nbtn" onclick="window.location.href='app.html#favoritos'">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
      </button>
      <button class="nbtn" onclick="openCart()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <span>Carrito</span><span class="nbadge hidden" id="cartBadge">0</span>
      </button>
      <button class="nbtn" onclick="window.location.href='app.html#cuenta'">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Cuenta</span>
      </button>
      <button class="nbtn nbtn-sell" onclick="window.location.href='app.html#sell'">Vender</button>
    </div>
  </div>
</div>

<!-- CATNAV -->
<div class="catnav">
  <div class="catnav-inner">
    <button class="cni" onclick="window.location.href='app.html'">Inicio</button>
    <button class="cni act" onclick="window.location.href='shop.html'">Catalogo</button>
    <button class="cni" onclick="window.location.href='app.html#sell'">Vender</button>
    <button class="cni" onclick="window.location.href='app.html#servicio'">Servicio tec.</button>
    <button class="cni" onclick="window.location.href='app.html#accesorios'">Accesorios</button>
    <button class="cni" onclick="window.location.href='app.html#notebooks'">Notebooks</button>
    <button class="cni" onclick="window.location.href='app.html#mayorista'">Mayoristas</button>
    <button class="cni" onclick="window.location.href='app.html#garantias'">Garantias</button>
    <button class="cni" onclick="window.location.href='app.html#compare'">Comparar</button>
    <button class="cni" onclick="filterShop('ofertas',this)">Ofertas</button>
  </div>
</div>

<!-- SHOP PAGE -->
<div class="page act" id="p-shop" style="display:block">
  <div class="sh-hdr">
    <div class="ctr"><h1 style="font-family:'Playfair Display',Georgia,serif;font-size:28px;color:#fff;margin-bottom:.25rem" id="shopTitle">Catalogo</h1><p style="font-size:12px;color:rgba(255,255,255,.4)" id="shopSub">Todos los equipos verificados con garantia incluida</p></div>
  </div>
  <div class="filter-bar">
    <div class="ctr">
      <div class="frow" id="filterBar">
        <button class="fchip act" onclick="filterShop('todos',this)">Todos</button>
        <button class="fchip" onclick="filterShop('iPhone',this)">iPhone</button>
        <button class="fchip" onclick="filterShop('iPad',this)">iPad</button>
        <button class="fchip" onclick="filterShop('MacBook',this)">MacBook</button>
        <button class="fchip" onclick="filterShop('iMac',this)">iMac</button>
        <button class="fchip" onclick="filterShop('Samsung',this)">Samsung</button>
        <button class="fchip" onclick="filterShop('Motorola',this)">Motorola</button>
        <button class="fchip" onclick="filterShop('Xiaomi',this)">Xiaomi</button>
        <button class="fchip" onclick="filterShop('ofertas',this)">Ofertas</button>
        <button class="fchip" onclick="filterShop('fav',this)">Favoritos</button>
      </div>
      <button class="adv-btn" onclick="toggleAdvF()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
        Filtros avanzados
        <svg id="afArr" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left:auto;transition:transform .2s"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>
    <div class="adv-panel" id="advPanel">
      <div class="ctr">
        <div class="af-row">
          <div class="af-grp"><span class="af-lbl">Almacenamiento</span><select class="af-sel" id="af-st" onchange="renderShopGrid()"><option value="">Cualquiera</option><option>64 GB</option><option>128 GB</option><option>256 GB</option><option>512 GB</option><option>1 TB</option></select></div>
          <div class="af-grp"><span class="af-lbl">Estado</span><select class="af-sel" id="af-cd" onchange="renderShopGrid()"><option value="">Cualquiera</option><option>Nuevo</option><option>Impecable</option><option>Muy bueno</option><option>Bueno</option></select></div>
          <div class="af-grp"><span class="af-lbl">Tipo</span><select class="af-sel" id="af-ty" onchange="renderShopGrid()"><option value="">Cualquiera</option><option value="celular">Celulares</option><option value="tablet">Tablets</option><option value="laptop">Laptops</option><option value="desktop">Desktop</option></select></div>
        </div>
        <div class="af-row">
          <div class="af-grp"><span class="af-lbl">Precio min</span><input class="af-inp" type="number" id="af-p1" placeholder="$0" oninput="renderShopGrid()"></div>
          <div class="af-grp"><span class="af-lbl">Precio max</span><input class="af-inp" type="number" id="af-p2" placeholder="Sin limite" oninput="renderShopGrid()"></div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-o btn-sm" onclick="renderShopGrid()">Aplicar</button>
          <button class="btn btn-s btn-sm" onclick="clearAdvF()">Limpiar</button>
        </div>
      </div>
    </div>
  </div>
  <div style="background:#fff;border-bottom:1px solid var(--border)">
    <div class="ctr">
      <div class="sort-row">
        <div class="sort-inner">
          <select class="sort-sel" id="sortSel" onchange="renderShopGrid()">
            <option value="rel">Relevancia</option><option value="asc">Menor precio</option>
            <option value="desc">Mayor precio</option><option value="new">Mas nuevos</option>
            <option value="bat">Mayor bateria</option>
          </select>
          <span class="sort-count" id="shopCount"></span>
        </div>
      </div>
    </div>
  </div>
  <div style="background:var(--cream)">
    <div class="ctr">
      <div class="shop-content"><div class="pgrid" id="shopGrid"></div></div>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="ctr">
    <div class="footer-logo">
      <div class="footer-mark">&#128241;</div>
      <div style="font-family:'Playfair Display',Georgia,serif;font-size:17px;color:#fff">Great Phones</div>
    </div>
    <p class="footer-sub">Zelarrayan 179, Bahia Blanca &middot; 9hs a 21:30hs lunes a lunes<br>@greatphones.bb &middot; +54 9 2914 72-7351</p>
    <div class="footer-links">
      <button class="fl-lnk" onclick="window.location.href='shop.html'">Comprar</button>
      <button class="fl-lnk" onclick="window.location.href='app.html#sell'">Vender</button>
      <button class="fl-lnk" onclick="window.location.href='app.html#servicio'">Servicio tecnico</button>
      <button class="fl-lnk" onclick="window.location.href='app.html#garantias'">Garantias</button>
      <button class="fl-lnk" onclick="window.location.href='app.html#accesorios'">Accesorios</button>
      <button class="fl-lnk" onclick="window.location.href='app.html#mayorista'">Mayorista</button>
      <button class="fl-lnk" onclick="filterShop('ofertas')">Ofertas</button>
      <button class="fl-lnk" onclick="window.location.href='app.html#compare'">Comparar</button>
      <button class="fl-lnk" onclick="window.location.href='app.html#notebooks'">Notebooks</button>
      <button class="fl-lnk" onclick="window.location.href='app.html#mensajes'">Mensajes</button>
    </div>
    <div class="footer-bottom">2025 Great Phones Bahia Blanca &mdash; Todos los derechos reservados</div>
  </div>
</footer>

<!-- CART OVERLAY -->
<div class="cart-overlay" id="cartOverlay">
  <div class="cart-bg" onclick="closeCart()"></div>
  <div class="cart-panel">
    <div class="cart-hdr"><div class="cart-title">Tu carrito</div><button class="cart-close" onclick="closeCart()">&#215;</button></div>
    <div class="cart-body" id="cartBody"></div>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:900;align-items:center;justify-content:center;cursor:zoom-out" onclick="this.style.display='none'">
  <img id="lightboxImg" style="max-width:95vw;max-height:90vh;border-radius:9px;object-fit:contain">
</div>

<script src="lib/constants.js"></script>
<script src="lib/utils.js"></script>
<script src="lib/search.js"></script>
<script src="lib/favorites.js"></script>
<script src="lib/cart.js"></script>
<script src="lib/render.js"></script>

<script>
document.addEventListener('DOMContentLoaded',function(){
  renderShopGrid();
});
function filterShop(cat,el){
  document.querySelectorAll('#filterBar .fchip').forEach(function(c){c.classList.remove('act');});
  if(el)el.classList.add('act');
  var title=document.getElementById('shopTitle');
  if(title)title.textContent=cat==='todos'?'Catalogo completo':cat==='ofertas'?'Ofertas del dia':cat;
  window.shopFilter=cat;
  renderShopGrid();
}
function toggleAdvF(){
  var panel=document.getElementById('advPanel');
  var arr=document.getElementById('afArr');
  if(panel)panel.classList.toggle('open');
  if(arr)arr.style.transform=panel.classList.contains('open')?'rotate(180deg)':'';
}
function clearAdvF(){
  ['af-st','af-cd','af-ty','af-p1','af-p2'].forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.value='';
  });
  renderShopGrid();
}
</script>

</body>
</html>
